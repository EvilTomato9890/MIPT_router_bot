[project]
name = "mipt-router-bot"
version = "2.0.0"
description = "Учёт роутеров общежития № 7: Python, Telegram, SQLite, Google Sheets"
requires-python = ">=3.13,<3.14"
dependencies = [
  "google-auth[requests]==2.62.1",
  "requests==2.34.2",
  "tzdata==2026.6",
  "python-dotenv==1.2.4",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4", "pip-audit==2.10.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
